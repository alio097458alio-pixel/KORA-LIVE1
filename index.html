<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KORA LIVE | Scores</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ================= CSS ================= */
    :root {
      --bg: #0a0a0c; --bg-card: #141418; --bg-card-2: #1c1c22;
      --gold: #d4af37; --gold-glow: rgba(212, 175, 55, 0.25);
      --accent: #00e0a4; --danger: #ff3b5c;
      --text: #f0f0f5; --text-dim: #8a8a95;
      --border: rgba(255, 255, 255, 0.06); --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    .hidden { display: none !important; }
    .accent { color: var(--gold); }

    /* Offline Banner */
    .offline-banner { position: fixed; top: 0; left: 0; right: 0; background: var(--danger); color: #fff; text-align: center; padding: 10px; font-size: 13px; font-weight: 700; z-index: 9999; }

    /* Auth Screen */
    .auth-screen { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 50% 0%, rgba(212,175,55,0.08), transparent 60%); }
    .auth-card { width: 100%; max-width: 400px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 36px 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .logo-icon { font-size: 44px; filter: drop-shadow(0 0 20px var(--gold-glow)); }
    .auth-logo h1 { font-size: 30px; font-weight: 900; margin-top: 8px; letter-spacing: 2px; }
    .auth-logo p { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

    .auth-tabs { display: flex; background: var(--bg-card-2); border-radius: 12px; padding: 4px; margin-bottom: 24px; }
    .auth-tab { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-dim); font-family: inherit; font-weight: 700; font-size: 14px; border-radius: 10px; cursor: pointer; transition: all 0.25s; }
    .auth-tab.active { background: var(--gold); color: #0a0a0c; }

    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
    .input-group input { width: 100%; padding: 12px 14px; background: var(--bg-card-2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 14px; transition: border-color 0.25s; }
    .input-group input:focus { outline: none; border-color: var(--gold); }

    .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold), #b8952e); color: #0a0a0c; font-weight: 800; font-size: 15px; border: none; border-radius: 10px; cursor: pointer; font-family: inherit; transition: transform 0.2s, box-shadow 0.3s; box-shadow: 0 4px 16px var(--gold-glow); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px var(--gold-glow); }
    .btn-primary:active { transform: scale(0.98); }

    .error-msg { color: var(--danger); text-align: center; margin-top: 10px; font-size: 12px; min-height: 16px; }
    .success-msg { color: var(--accent); text-align: center; margin-top: 10px; font-size: 12px; }

    /* App Layout */
    .app { padding: 16px; padding-bottom: 90px; max-width: 600px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; margin-bottom: 8px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand h2 { font-size: 20px; font-weight: 900; letter-spacing: 1px; }
    .brand .logo-icon { font-size: 24px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-size: 16px; color: var(--text); }
    .avatar-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); cursor: pointer; font-size: 18px; display: grid; place-items: center; }

    .profile-menu { position: relative; }
    .dropdown { position: absolute; top: 48px; left: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; min-width: 200px; padding: 8px; z-index: 100; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    .dropdown-header { padding: 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
    .dropdown-header strong { display: block; font-size: 14px; }
    .dropdown-header small { color: var(--text-dim); font-size: 11px; }
    .dropdown a { display: block; padding: 10px; color: var(--danger); text-decoration: none; font-size: 13px; border-radius: 8px; }
    .dropdown a:hover { background: rgba(255,59,92,0.1); }

    /* Date Tabs */
    .date-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
    .date-tabs::-webkit-scrollbar { display: none; }
    .date-tab { flex: 0 0 auto; padding: 8px 18px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; color: var(--text-dim); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.25s; }
    .date-tab.active { background: var(--gold); color: #0a0a0c; border-color: var(--gold); }

    .section { margin-bottom: 24px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-head h3 { font-size: 16px; font-weight: 800; }
    .live-indicator { display: flex; align-items: center; gap: 6px; color: var(--danger); font-size: 12px; font-weight: 800; }
    .pulse { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: pulse 1.4s infinite; }

    /* Match Card */
    .matches-list { display: flex; flex-direction: column; gap: 12px; }
    .match-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; transition: border-color 0.25s, transform 0.2s; }
    .match-card:hover { border-color: rgba(212,175,55,0.3); transform: translateY(-2px); }
    .match-league { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .match-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
    .team { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .team-logo { width: 42px; height: 42px; background: var(--bg-card-2); border-radius: 50%; display: grid; place-items: center; font-size: 22px; }
    .team-name { font-size: 13px; font-weight: 700; text-align: center; }
    .match-score { font-size: 22px; font-weight: 900; color: var(--accent); padding: 4px 14px; background: rgba(0,224,164,0.08); border-radius: 8px; }
    .match-score.live { color: var(--danger); background: rgba(255,59,92,0.1); }
    .match-meta { text-align: center; margin-top: 10px; font-size: 11px; color: var(--text-dim); }
    .match-meta .live-time { color: var(--danger); font-weight: 700; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; background: rgba(20, 20, 24, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 8px 0 12px; z-index: 200; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--text-dim); font-family: inherit; font-size: 10px; font-weight: 600; cursor: pointer; padding: 4px 12px; transition: color 0.25s; }
    .nav-item.active { color: var(--gold); }
    .nav-item span { font-size: 10px; }

    /* Modals */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px; z-index: 1000; }
    .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .stream-modal { max-width: 900px; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-head h3 { font-size: 16px; font-weight: 800; }
    .close-btn { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 4px 8px; }
    .iframe-container { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; }
    .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,92,0.7); } 50% { box-shadow: 0 0 0 8px rgba(255,59,92,0); } }
  </style>
</head>
<body>

  <!-- Offline Banner -->
  <div id="offlineBanner" class="offline-banner hidden">
    ⚠️ أنت غير متصل بالإنترنت. يرجى فتح الاتصال لتحديث البيانات.
  </div>

  <!-- Login / Register Screen -->
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">⚽</span>
        <h1>KORA <span class="accent">LIVE</span></h1>
        <p>منصة كرة القدم الاحترافية</p>
      </div>

      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active">تسجيل الدخول</button>
        <button id="tabRegister" class="auth-tab">إنشاء حساب</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <div class="input-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary">دخول</button>
        <p id="loginError" class="error-msg"></p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form hidden">
        <div class="input-group">
          <label>الاسم</label>
          <input type="text" id="regName" placeholder="اسمك" required />
        </div>
        <div class="input-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required />
        </div>
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="password" id="regPassword" placeholder="6 أحرف على الأقل" required minlength="6" />
        </div>
        <button type="submit" class="btn-primary">إنشاء الحساب</button>
        <p id="registerError" class="error-msg"></p>
      </form>
    </div>
  </section>

  <!-- Main App -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <span class="logo-icon">⚽</span>
        <h2>KORA <span class="accent">LIVE</span></h2>
      </div>
      <div class="header-actions">
        <button id="adminBtn" class="icon-btn hidden" title="لوحة التحكم">⚙️</button>
        <div class="profile-menu">
          <button id="profileBtn" class="avatar-btn">👤</button>
          <div id="profileDropdown" class="dropdown hidden">
            <div class="dropdown-header">
              <strong id="userName">مستخدم</strong>
              <small id="userEmail">user@email.com</small>
            </div>
            <a href="#" id="logoutBtn">تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </header>

    <div class="date-tabs">
      <button class="date-tab">أمس</button>
      <button class="date-tab active">اليوم</button>
      <button class="date-tab">غداً</button>
    </div>

    <section class="section">
      <div class="section-head">
        <h3>مباشر الآن</h3>
        <span class="live-indicator"><span class="pulse"></span> LIVE</span>
      </div>
      <div id="liveMatches" class="matches-list"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h3>جميع المباريات</h3>
      </div>
      <div id="allMatches" class="matches-list"></div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-item active" data-page="scores">🏆<span>النتائج</span></button>
      <button class="nav-item" data-page="favorites">⭐<span>المفضلة</span></button>
      <button class="nav-item" data-page="streams">📺<span>البث</span></button>
      <button class="nav-item" data-page="news">📰<span>الأخبار</span></button>
      <button class="nav-item" data-page="profile">👤<span>حسابي</span></button>
    </nav>
  </div>

  <!-- Admin Modal -->
  <div id="adminModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-head">
        <h3>لوحة التحكم — نشر بث مباشر</h3>
        <button id="closeAdmin" class="close-btn">✕</button>
      </div>
      <form id="streamForm">
        <div class="input-group">
          <label>اسم المباراة / البث</label>
          <input type="text" id="streamTitle" placeholder="ريال مدريد vs برشلونة" required />
        </div>
        <div class="input-group">
          <label>رابط البث المباشر (Embed URL)</label>
          <input type="url" id="streamUrl" placeholder="https://www.youtube.com/embed/..." required />
        </div>
        <div class="input-group">
          <label>الدوري</label>
          <input type="text" id="streamLeague" placeholder="الليغا" required />
        </div>
        <button type="submit" class="btn-primary">نشر البث</button>
      </form>
      <p id="adminMsg" class="success-msg"></p>
    </div>
  </div>

  <!-- Stream Modal -->
  <div id="streamModal" class="modal hidden">
    <div class="modal-content stream-modal">
      <div class="modal-head">
        <h3 id="streamModalTitle">بث مباشر</h3>
        <button id="closeStream" class="close-btn">✕</button>
      </div>
      <div class="iframe-container">
        <iframe id="streamIframe" src="" allowfullscreen allow="autoplay; fullscreen"></iframe>
      </div>
    </div>
  </div>

  <!-- ================= JS ================= -->
  <script>
    // ==========================================
    // ⚠️ إعدادات Firebase (اختياري)
    // إذا تركتها فارغة سيعمل التطبيق في الوضع التجريبي
    // ==========================================
    const firebaseConfig = {
      apiKey: "", 
      authDomain: "",
      projectId: "",
      storageBucket: "",
      messagingSenderId: "",
      appId: ""
    };

    // متغيرات الحالة
    let currentUser = null;
    let isFirebaseReady = false;

    // عناصر DOM
    const authScreen = document.getElementById('authScreen');
    const appEl = document.getElementById('app');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginError = document.getElementById('loginError');
    const registerError = document.getElementById('registerError');
    const offlineBanner = document.getElementById('offlineBanner');
    const profileBtn = document.getElementById('profileBtn');
    const profileDropdown = document.getElementById('profileDropdown');
    const logoutBtn = document.getElementById('logoutBtn');
    const adminBtn = document.getElementById('adminBtn');
    const adminModal = document.getElementById('adminModal');
    const closeAdmin = document.getElementById('closeAdmin');
    const streamModal = document.getElementById('streamModal');
    const closeStream = document.getElementById('closeStream');
    const streamIframe = document.getElementById('streamIframe');

    // ==========================================
    // 1. معالجة الإنترنت
    // ==========================================
    window.addEventListener('online', () => { offlineBanner.classList.add('hidden'); });
    window.addEventListener('offline', () => { offlineBanner.classList.remove('hidden'); });
    if (!navigator.onLine) offlineBanner.classList.remove('hidden');

    // ==========================================
    // 2. تبديل التبويبات
    // ==========================================
    document.getElementById('tabLogin').addEventListener('click', () => {
      document.getElementById('tabLogin').classList.add('active');
      document.getElementById('tabRegister').classList.remove('active');
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
    });
    document.getElementById('tabRegister').addEventListener('click', () => {
      document.getElementById('tabRegister').classList.add('active');
      document.getElementById('tabLogin').classList.remove('active');
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
    });

    // ==========================================
    // 3. نظام المصادقة (Demo + Firebase)
    // ==========================================
    
    // دالة عرض التطبيق
    function showApp(userData) {
      authScreen.classList.add('hidden');
      appEl.classList.remove('hidden');
      document.getElementById('userName').textContent = userData.name;
      document.getElementById('userEmail').textContent = userData.email;
      
      if (userData.role === 'admin') adminBtn.classList.remove('hidden');
      else adminBtn.classList.add('hidden');

      loadMatches(); // تحميل المباريات
    }

    // إنشاء حساب
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      registerError.textContent = '';
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      if (password.length < 6) {
        registerError.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
        return;
      }

      if (!isFirebaseReady) {
        // الوضع التجريبي (Demo Mode)
        const users = JSON.parse(localStorage.getItem('demo_users') || '[]');
        if (users.find(u => u.email === email)) {
          registerError.textContent = 'البريد الإلكتروني مستخدم بالفعل';
          return;
        }
        const newUser = { uid: 'demo_' + Date.now(), name, email, password, role: 'user' };
        users.push(newUser);
        localStorage.setItem('demo_users', JSON.stringify(users));
        localStorage.setItem('demo_session', JSON.stringify(newUser));
        showApp(newUser);
        registerForm.reset();
      } else {
        // Firebase Mode (يضاف لاحقاً عند وضع المفاتيح)
        try {
          const { createUserWithEmailAndPassword, updateProfile } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
          const { doc, setDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          
          // ملاحظة: يجب أن تكون auth و db معرفة مسبقاً (سنقوم بذلك تلقائياً إذا وضعت المفاتيح)
          const cred = await createUserWithEmailAndPassword(window._auth, email, password);
          await updateProfile(cred.user, { displayName: name });
          await setDoc(doc(window._db, 'users', cred.user.uid), {
            name, email, role: 'user', createdAt: serverTimestamp()
          });
          showApp({ name, email, role: 'user' });
        } catch (err) {
          registerError.textContent = err.message || 'حدث خطأ في إنشاء الحساب';
        }
      }
    });

    // تسجيل الدخول
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!isFirebaseReady) {
        // الوضع التجريبي
        const users = JSON.parse(localStorage.getItem('demo_users') || '[]');
        
        // حساب الأدمن الافتراضي
        const adminUser = { uid: 'admin_01', name: 'المدير', email: 'admin@kora.com', password: '01152800730', role: 'admin' };
        
        let user = users.find(u => u.email === email && u.password === password);
        if (!user && email === adminUser.email && password === adminUser.password) {
          user = adminUser;
        }

        if (user) {
          localStorage.setItem('demo_session', JSON.stringify(user));
          showApp(user);
        } else {
          loginError.textContent = 'بيانات الدخول غير صحيحة';
        }
      } else {
        // Firebase Mode
        try {
          const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
          const { doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
          
          const cred = await signInWithEmailAndPassword(window._auth, email, password);
          const userDoc = await getDoc(doc(window._db, 'users', cred.user.uid));
          const data = userDoc.exists() ? userDoc.data() : { name: email, email, role: 'user' };
          showApp(data);
        } catch (err) {
          loginError.textContent = 'بيانات الدخول غير صحيحة';
        }
      }
    });

    // تسجيل الخروج
    logoutBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      if (isFirebaseReady) {
        const { signOut } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
        await signOut(window._auth);
      }
      localStorage.removeItem('demo_session');
      appEl.classList.add('hidden');
      authScreen.classList.remove('hidden');
      profileDropdown.classList.add('hidden');
    });

    // ==========================================
    // 4. الملف الشخصي
    // ==========================================
    profileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.classList.toggle('hidden');
    });
    document.addEventListener('click', () => profileDropdown.classList.add('hidden'));

    // ==========================================
    // 5. عرض المباريات
    // ==========================================
    const demoMatches = [
      { league: 'دوري أبطال أوروبا', home: 'ريال مدريد', away: 'برشلونة', homeScore: 1, awayScore: 0, status: 'live', minute: "67'", streamUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
      { league: 'الدوري الإنجليزي', home: 'ليفربول', away: 'مانشستر سيتي', homeScore: 2, awayScore: 2, status: 'finished', time: 'انتهت' },
      { league: 'الدوري الإسباني', home: 'أتلتيكو', away: 'إشبيلية', homeScore: 0, awayScore: 0, status: 'upcoming', time: '21:00' }
    ];

    function loadMatches() {
      renderMatches(demoMatches.filter(m => m.status === 'live'), true);
      renderMatches(demoMatches, false);
    }

    function renderMatches(matches, isLive) {
      const container = isLive ? document.getElementById('liveMatches') : document.getElementById('allMatches');
      if (matches.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:var(--text-dim); font-size:13px;">لا توجد مباريات حالياً</p>`;
        return;
      }
      container.innerHTML = matches.map(m => {
        const scoreClass = m.status === 'live' ? 'match-score live' : 'match-score';
        const meta = m.status === 'live' ? `<div class="match-meta"><span class="live-time">${m.minute}</span> — مباشر</div>` : `<div class="match-meta">${m.time || ''}</div>`;
        const streamBtn = m.streamUrl ? `<button class="btn-stream" data-url="${m.streamUrl}" data-title="${m.home} vs ${m.away}" style="width:100%; margin-top:10px; padding:8px; background:var(--gold); color:#000; border:none; border-radius:8px; font-weight:700; cursor:pointer;">📺 مشاهدة البث</button>` : '';
        
        return `
          <div class="match-card">
            <div class="match-league">🏆 ${m.league}</div>
            <div class="match-teams">
              <div class="team"><div class="team-logo">⚽</div><div class="team-name">${m.home}</div></div>
              <div class="${scoreClass}">${m.homeScore} - ${m.awayScore}</div>
              <div class="team"><div class="team-logo">⚽</div><div class="team-name">${m.away}</div></div>
            </div>
            ${meta}${streamBtn}
          </div>
        `;
      }).join('');

      container.querySelectorAll('.btn-stream').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('streamModalTitle').textContent = btn.dataset.title;
          streamIframe.src = btn.dataset.url;
          streamModal.classList.remove('hidden');
        });
      });
    }

    // إغلاق مشغل البث
    closeStream.addEventListener('click', () => {
      streamModal.classList.add('hidden');
      streamIframe.src = '';
    });

    // ==========================================
    // 6. لوحة التحكم (الأدمن)
    // ==========================================
    adminBtn.addEventListener('click', () => adminModal.classList.remove('hidden'));
    closeAdmin.addEventListener('click', () => adminModal.classList.add('hidden'));
    
    document.getElementById('streamForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('streamTitle').value;
      const url = document.getElementById('streamUrl').value;
      const league = document.getElementById('streamLeague').value;
      
      // محاكاة النشر في الوضع التجريبي
      alert(`✅ تم نشر البث بنجاح!\n\n${title}\n${league}`);
      document.getElementById('streamForm').reset();
      adminModal.classList.add('hidden');
    });

    // ==========================================
    // 7. التحقق من الجلسة المحفوظة
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      const session = JSON.parse(localStorage.getItem('demo_session'));
      if (session) showApp(session);
    });

    // ==========================================
    // 8. محاولة تفعيل Firebase (إذا وضعت المفاتيح)
    // ==========================================
    if (firebaseConfig.apiKey) {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
        const { getAuth } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
        const { getFirestore } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
        
        const app = initializeApp(firebaseConfig);
        window._auth = getAuth(app);
        window._db = getFirestore(app);
        isFirebaseReady = true;
        console.log('✅ Firebase Ready');
      } catch (err) {
        console.warn('⚠️ Firebase failed, falling back to Demo Mode', err);
      }
    } else {
      console.log('ℹ️ Firebase not configured. Running in Demo Mode.');
    }
  </script>
</body>
</html>
