<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KORA LIVE | Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ================= CSS ================= */
    :root {
      --bg: #08080a; 
      --bg-card: #121216; 
      --bg-card-2: #1a1a20;
      --gold: #d4af37; 
      --gold-light: #f5e6a8;
      --gold-glow: rgba(212, 175, 55, 0.3);
      --accent: #00e0a4; 
      --danger: #ff3b5c;
      --text: #f5f5f7; 
      --text-dim: #8a8a95;
      --border: rgba(255, 255, 255, 0.08); 
      --radius: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    .hidden { display: none !important; }
    .accent { color: var(--gold); }

    /* خلفية متحركة فاخرة */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1;
      background: 
        radial-gradient(circle at 20% 10%, rgba(212,175,55,0.15), transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(0,224,164,0.08), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255,59,92,0.04), transparent 50%);
      animation: bgMove 15s ease-in-out infinite alternate;
    }
    @keyframes bgMove { from { transform: scale(1); } to { transform: scale(1.15); } }

    /* Offline Banner */
    .offline-banner { position: fixed; top: 0; left: 0; right: 0; background: var(--danger); color: #fff; text-align: center; padding: 10px; font-size: 13px; font-weight: 700; z-index: 9999; }

    /* ===== شاشة التسجيل الفاخرة ===== */
    .auth-screen { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .auth-card { 
      width: 100%; max-width: 420px; 
      background: linear-gradient(145deg, rgba(18,18,22,0.95), rgba(10,10,12,0.98));
      border: 1px solid var(--border); 
      border-radius: var(--radius); 
      padding: 40px 30px; 
      box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      animation: shine 3s infinite;
    }
    @keyframes shine { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

    .auth-logo { text-align: center; margin-bottom: 32px; }
    .logo-circle {
      width: 70px; height: 70px; margin: 0 auto 14px;
      background: linear-gradient(135deg, var(--gold), #8a6d1f);
      border-radius: 20px; display: grid; place-items: center;
      font-size: 34px; box-shadow: 0 10px 30px var(--gold-glow);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .auth-logo h1 { font-size: 30px; font-weight: 900; letter-spacing: 3px; }
    .auth-logo p { color: var(--text-dim); font-size: 12px; margin-top: 6px; letter-spacing: 1px; }

    .auth-tabs { display: flex; background: var(--bg-card-2); border-radius: 14px; padding: 5px; margin-bottom: 26px; }
    .auth-tab { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-dim); font-family: inherit; font-weight: 700; font-size: 14px; border-radius: 10px; cursor: pointer; transition: all 0.3s; }
    .auth-tab.active { background: linear-gradient(135deg, var(--gold), #b8952e); color: #0a0a0c; box-shadow: 0 4px 14px var(--gold-glow); }

    .input-group { margin-bottom: 16px; position: relative; }
    .input-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; font-weight: 600; }
    .input-group input { 
      width: 100%; padding: 14px 16px; 
      background: rgba(255,255,255,0.03); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      color: var(--text); font-family: inherit; font-size: 14px; 
      transition: all 0.3s;
    }
    .input-group input:focus { outline: none; border-color: var(--gold); background: rgba(212,175,55,0.05); box-shadow: 0 0 0 3px var(--gold-glow); }

    .btn-primary { 
      width: 100%; padding: 15px; 
      background: linear-gradient(135deg, var(--gold), #b8952e); 
      color: #0a0a0c; font-weight: 800; font-size: 15px; 
      border: none; border-radius: 12px; cursor: pointer; font-family: inherit; 
      transition: transform 0.2s, box-shadow 0.3s; 
      box-shadow: 0 6px 20px var(--gold-glow);
      margin-top: 8px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px var(--gold-glow); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg { color: var(--danger); text-align: center; margin-top: 12px; font-size: 12px; min-height: 16px; }
    .success-msg { color: var(--accent); text-align: center; margin-top: 12px; font-size: 12px; }

    .demo-hint { 
      margin-top: 20px; padding: 12px; 
      background: rgba(212,175,55,0.06); 
      border: 1px dashed rgba(212,175,55,0.3); 
      border-radius: 10px; 
      font-size: 11px; color: var(--text-dim); text-align: center; line-height: 1.7;
    }
    .demo-hint b { color: var(--gold); }

    /* ===== التطبيق ===== */
    .app { padding: 16px; padding-bottom: 90px; max-width: 600px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; margin-bottom: 8px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand h2 { font-size: 20px; font-weight: 900; letter-spacing: 1px; }
    .brand .logo-icon { font-size: 24px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-size: 16px; color: var(--text); }
    .avatar-btn { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #b8952e); border: none; cursor: pointer; font-size: 18px; display: grid; place-items: center; color: #000; }

    .profile-menu { position: relative; }
    .dropdown { position: absolute; top: 48px; left: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; min-width: 200px; padding: 8px; z-index: 100; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    .dropdown-header { padding: 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
    .dropdown-header strong { display: block; font-size: 14px; }
    .dropdown-header small { color: var(--text-dim); font-size: 11px; }
    .dropdown a { display: block; padding: 10px; color: var(--danger); text-decoration: none; font-size: 13px; border-radius: 8px; }
    .dropdown a:hover { background: rgba(255,59,92,0.1); }

    .date-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
    .date-tabs::-webkit-scrollbar { display: none; }
    .date-tab { flex: 0 0 auto; padding: 8px 18px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; color: var(--text-dim); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.25s; }
    .date-tab.active { background: var(--gold); color: #0a0a0c; border-color: var(--gold); }

    .section { margin-bottom: 24px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .section-head h3 { font-size: 16px; font-weight: 800; }
    .live-indicator { display: flex; align-items: center; gap: 6px; color: var(--danger); font-size: 12px; font-weight: 800; }
    .pulse { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; animation: pulse 1.4s infinite; }

    .matches-list { display: flex; flex-direction: column; gap: 12px; }
    .match-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; transition: border-color 0.25s, transform 0.2s; }
    .match-card:hover { border-color: rgba(212,175,55,0.3); transform: translateY(-2px); }
    .match-league { font-size: 11px; color: var(--text-dim); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .match-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
    .team { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .team-logo { width: 42px; height: 42px; background: var(--bg-card-2); border-radius: 50%; display: grid; place-items: center; font-size: 22px; }
    .team-name { font-size: 13px; font-weight: 700; text-align: center; }
    .match-score { font-size: 22px; font-weight: 900; color: var(--accent); padding: 4px 14px; background: rgba(0,224,164,0.08); border-radius: 8px; }
    .match-score.live { color: var(--danger); background: rgba(255,59,92,0.1); }
    .match-meta { text-align: center; margin-top: 10px; font-size: 11px; color: var(--text-dim); }
    .match-meta .live-time { color: var(--danger); font-weight: 700; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; background: rgba(18,18,22,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 8px 0 12px; z-index: 200; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--text-dim); font-family: inherit; font-size: 10px; font-weight: 600; cursor: pointer; padding: 4px 12px; transition: color 0.25s; }
    .nav-item.active { color: var(--gold); }
    .nav-item span { font-size: 10px; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 20px; z-index: 1000; }
    .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
    .stream-modal { max-width: 900px; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .modal-head h3 { font-size: 16px; font-weight: 800; }
    .close-btn { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 4px 8px; }
    .iframe-container { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; background: #000; }
    .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,92,0.7); } 50% { box-shadow: 0 0 0 8px rgba(255,59,92,0); } }
  </style>
</head>
<body>

  <div id="offlineBanner" class="offline-banner hidden">⚠️ أنت غير متصل بالإنترنت</div>

  <!-- شاشة التسجيل -->
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-circle">⚽</div>
        <h1>KORA <span class="accent">LIVE</span></h1>
        <p>منصة كرة القدم الاحترافية</p>
      </div>

      <div class="auth-tabs">
        <button type="button" id="tabLogin" class="auth-tab active">تسجيل الدخول</button>
        <button type="button" id="tabRegister" class="auth-tab">إنشاء حساب</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="input-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" id="loginBtn" class="btn-primary">دخول</button>
        <p id="loginError" class="error-msg"></p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="hidden">
        <div class="input-group">
          <label>الاسم</label>
          <input type="text" id="regName" placeholder="اسمك الكامل" required />
        </div>
        <div class="input-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required />
        </div>
        <div class="input-group">
          <label>كلمة المرور</label>
          <input type="password" id="regPassword" placeholder="6 أحرف على الأقل" required minlength="6" />
        </div>
        <button type="submit" id="registerBtn" class="btn-primary">إنشاء الحساب</button>
        <p id="registerError" class="error-msg"></p>
      </form>

      <div class="demo-hint">
        🔑 <b>حساب الأدمن التجريبي:</b><br>
        admin@kora.com / 01152800730
      </div>
    </div>
  </section>

  <!-- التطبيق -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <span class="logo-icon">⚽</span>
        <h2>KORA <span class="accent">LIVE</span></h2>
      </div>
      <div class="header-actions">
        <button id="adminBtn" class="icon-btn hidden" title="لوحة التحكم">⚙️</button>
        <div class="profile-menu">
          <button id="profileBtn" class="avatar-btn">👤</button>
          <div id="profileDropdown" class="dropdown hidden">
            <div class="dropdown-header">
              <strong id="userName">مستخدم</strong>
              <small id="userEmail">user@email.com</small>
            </div>
            <a href="#" id="logoutBtn">تسجيل الخروج</a>
          </div>
        </div>
      </div>
    </header>

    <div class="date-tabs">
      <button class="date-tab">أمس</button>
      <button class="date-tab active">اليوم</button>
      <button class="date-tab">غداً</button>
    </div>

    <section class="section">
      <div class="section-head">
        <h3>مباشر الآن</h3>
        <span class="live-indicator"><span class="pulse"></span> LIVE</span>
      </div>
      <div id="liveMatches" class="matches-list"></div>
    </section>

    <section class="section">
      <div class="section-head"><h3>جميع المباريات</h3></div>
      <div id="allMatches" class="matches-list"></div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-item active">🏆<span>النتائج</span></button>
      <button class="nav-item">⭐<span>المفضلة</span></button>
      <button class="nav-item">📺<span>البث</span></button>
      <button class="nav-item">📰<span>الأخبار</span></button>
      <button class="nav-item">👤<span>حسابي</span></button>
    </nav>
  </div>

  <!-- Admin Modal -->
  <div id="adminModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-head">
        <h3>لوحة التحكم</h3>
        <button id="closeAdmin" class="close-btn">✕</button>
      </div>
      <form id="streamForm">
        <div class="input-group">
          <label>اسم المباراة</label>
          <input type="text" id="streamTitle" placeholder="ريال مدريد vs برشلونة" required />
        </div>
        <div class="input-group">
          <label>رابط البث (Embed)</label>
          <input type="url" id="streamUrl" placeholder="https://www.youtube.com/embed/..." required />
        </div>
        <div class="input-group">
          <label>الدوري</label>
          <input type="text" id="streamLeague" placeholder="الليغا" required />
        </div>
        <button type="submit" class="btn-primary">نشر البث</button>
      </form>
      <p id="adminMsg" class="success-msg"></p>
    </div>
  </div>

  <!-- Stream Modal -->
  <div id="streamModal" class="modal hidden">
    <div class="modal-content stream-modal">
      <div class="modal-head">
        <h3 id="streamModalTitle">بث مباشر</h3>
        <button id="closeStream" class="close-btn">✕</button>
      </div>
      <div class="iframe-container">
        <iframe id="streamIframe" src="" allowfullscreen allow="autoplay; fullscreen"></iframe>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // بيانات المستخدمين (Demo Mode - localStorage)
    // ==========================================
    const STORAGE_USERS = 'kora_users';
    const STORAGE_SESSION = 'kora_session';

    // إنشاء حساب الأدمن الافتراضي إذا لم يوجد
    function initAdmin() {
      let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || '[]');
      if (!users.find(u => u.email === 'admin@kora.com')) {
        users.push({
          uid: 'admin_001',
          name: 'المدير',
          email: 'admin@kora.com',
          password: '01152800730',
          role: 'admin'
        });
        localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
      }
    }
    initAdmin();

    // ==========================================
    // عناصر DOM
    // ==========================================
    const authScreen = document.getElementById('authScreen');
    const appEl = document.getElementById('app');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginError = document.getElementById('loginError');
    const registerError = document.getElementById('registerError');
    const offlineBanner = document.getElementById('offlineBanner');
    const profileBtn = document.getElementById('profileBtn');
    const profileDropdown = document.getElementById('profileDropdown');
    const logoutBtn = document.getElementById('logoutBtn');
    const adminBtn = document.getElementById('adminBtn');
    const adminModal = document.getElementById('adminModal');
    const closeAdmin = document.getElementById('closeAdmin');
    const streamModal = document.getElementById('streamModal');
    const closeStream = document.getElementById('closeStream');
    const streamIframe = document.getElementById('streamIframe');

    // ==========================================
    // معالجة الإنترنت
    // ==========================================
    window.addEventListener('online', () => offlineBanner.classList.add('hidden'));
    window.addEventListener('offline', () => offlineBanner.classList.remove('hidden'));
    if (!navigator.onLine) offlineBanner.classList.remove('hidden');

    // ==========================================
    // تبديل التبويبات
    // ==========================================
    document.getElementById('tabLogin').addEventListener('click', () => {
      document.getElementById('tabLogin').classList.add('active');
      document.getElementById('tabRegister').classList.remove('active');
      loginForm.classList.remove('hidden');
      registerForm.classList.add('hidden');
    });
    document.getElementById('tabRegister').addEventListener('click', () => {
      document.getElementById('tabRegister').classList.add('active');
      document.getElementById('tabLogin').classList.remove('active');
      registerForm.classList.remove('hidden');
      loginForm.classList.add('hidden');
    });

    // ==========================================
    // دالة عرض التطبيق
    // ==========================================
    function showApp(userData) {
      authScreen.classList.add('hidden');
      appEl.classList.remove('hidden');
      document.getElementById('userName').textContent = userData.name;
      document.getElementById('userEmail').textContent = userData.email;
      
      if (userData.role === 'admin') adminBtn.classList.remove('hidden');
      else adminBtn.classList.add('hidden');

      loadMatches();
    }

    // ==========================================
    // تسجيل الدخول
    // ==========================================
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      loginError.textContent = '';
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        loginError.textContent = 'يرجى ملء جميع الحقول';
        return;
      }

      const users = JSON.parse(localStorage.getItem(STORAGE_USERS) || '[]');
      const user = users.find(u => u.email === email && u.password === password);

      if (user) {
        localStorage.setItem(STORAGE_SESSION, JSON.stringify(user));
        showApp(user);
      } else {
        loginError.textContent = '❌ البريد أو كلمة المرور غير صحيحة';
      }
    });

    // ==========================================
    // إنشاء حساب
    // ==========================================
    registerForm.addEventListener('submit', function(e) {
      e.preventDefault();
      registerError.textContent = '';
      
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      if (password.length < 6) {
        registerError.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
        return;
      }

      const users = JSON.parse(localStorage.getItem(STORAGE_USERS) || '[]');
      
      if (users.find(u => u.email === email)) {
        registerError.textContent = '❌ هذا البريد مستخدم بالفعل';
        return;
      }

      const newUser = {
        uid: 'user_' + Date.now(),
        name: name,
        email: email,
        password: password,
        role: 'user'
      };
      
      users.push(newUser);
      localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
      localStorage.setItem(STORAGE_SESSION, JSON.stringify(newUser));
      
      registerForm.reset();
      showApp(newUser);
    });

    // ==========================================
    // تسجيل الخروج
    // ==========================================
    logoutBtn.addEventListener('click', function(e) {
      e.preventDefault();
      localStorage.removeItem(STORAGE_SESSION);
      appEl.classList.add('hidden');
      authScreen.classList.remove('hidden');
      profileDropdown.classList.add('hidden');
      loginForm.reset();
      registerForm.reset();
    });

    // ==========================================
    // الملف الشخصي
    // ==========================================
    profileBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      profileDropdown.classList.toggle('hidden');
    });
    document.addEventListener('click', () => profileDropdown.classList.add('hidden'));

    // ==========================================
    // المباريات (بيانات تجريبية)
    // ==========================================
    const demoMatches = [
      { league: 'دوري أبطال أوروبا', home: 'ريال مدريد', away: 'برشلونة', homeScore: 1, awayScore: 0, status: 'live', minute: "67'", streamUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ' },
      { league: 'الدوري الإنجليزي', home: 'ليفربول', away: 'مانشستر سيتي', homeScore: 2, awayScore: 2, status: 'finished', time: 'انتهت' },
      { league: 'الدوري الإسباني', home: 'أتلتيكو', away: 'إشبيلية', homeScore: 0, awayScore: 0, status: 'upcoming', time: '21:00' }
    ];

    function loadMatches() {
      renderMatches(demoMatches.filter(m => m.status === 'live'), true);
      renderMatches(demoMatches, false);
    }

    function renderMatches(matches, isLive) {
      const container = isLive ? document.getElementById('liveMatches') : document.getElementById('allMatches');
      if (matches.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-dim); font-size:13px;">لا توجد مباريات حالياً</p>';
        return;
      }
      container.innerHTML = matches.map(function(m) {
        const scoreClass = m.status === 'live' ? 'match-score live' : 'match-score';
        const meta = m.status === 'live' 
          ? '<div class="match-meta"><span class="live-time">' + m.minute + '</span> — مباشر</div>' 
          : '<div class="match-meta">' + (m.time || '') + '</div>';
        const streamBtn = m.streamUrl 
          ? '<button class="btn-stream" data-url="' + m.streamUrl + '" data-title="' + m.home + ' vs ' + m.away + '" style="width:100%; margin-top:10px; padding:8px; background:var(--gold); color:#000; border:none; border-radius:8px; font-weight:700; cursor:pointer;">📺 مشاهدة البث</button>' 
          : '';
        
        return '<div class="match-card">' +
          '<div class="match-league">🏆 ' + m.league + '</div>' +
          '<div class="match-teams">' +
            '<div class="team"><div class="team-logo">⚽</div><div class="team-name">' + m.home + '</div></div>' +
            '<div class="' + scoreClass + '">' + m.homeScore + ' - ' + m.awayScore + '</div>' +
            '<div class="team"><div class="team-logo">⚽</div><div class="team-name">' + m.away + '</div></div>' +
          '</div>' + meta + streamBtn +
        '</div>';
      }).join('');

      container.querySelectorAll('.btn-stream').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.getElementById('streamModalTitle').textContent = btn.dataset.title;
          streamIframe.src = btn.dataset.url;
          streamModal.classList.remove('hidden');
        });
      });
    }

    // ==========================================
    // مشغل البث
    // ==========================================
    closeStream.addEventListener('click', function() {
      streamModal.classList.add('hidden');
      streamIframe.src = '';
    });

    // ==========================================
    // لوحة الأدمن
    // ==========================================
    adminBtn.addEventListener('click', function() {
      adminModal.classList.remove('hidden');
    });
    closeAdmin.addEventListener('click', function() {
      adminModal.classList.add('hidden');
    });
    
    document.getElementById('streamForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const title = document.getElementById('streamTitle').value;
      const url = document.getElementById('streamUrl').value;
      const league = document.getElementById('streamLeague').value;
      
      const newMatch = {
        league: league,
        home: title.split(/vs|ضد/i)[0] || 'الفريق 1',
        away: title.split(/vs|ضد/i)[1] || 'الفريق 2',
        homeScore: 0, awayScore: 0,
        status: 'live', minute: "1'",
        streamUrl: url
      };
      
      demoMatches.unshift(newMatch);
      loadMatches();
      
      document.getElementById('streamForm').reset();
      document.getElementById('adminMsg').textContent = '✅ تم نشر البث بنجاح!';
      
      setTimeout(function() {
        adminModal.classList.add('hidden');
        document.getElementById('adminMsg').textContent = '';
      }, 1500);
    });

    // ==========================================
    // التحقق من الجلسة المحفوظة عند التحميل
    // ==========================================
    window.addEventListener('DOMContentLoaded', function() {
      const session = JSON.parse(localStorage.getItem(STORAGE_SESSION) || 'null');
      if (session) showApp(session);
    });
  </script>
</body>
</html>
